name: Build AndroidPocketTerm

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: AndroidPocketTerm
  APP_PACKAGE: com.t3rmux   # must stay exactly 10 characters, like com.termux

jobs:
  apk:
    name: Build and sign APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone termux-app
        run: git clone --depth 1 https://github.com/termux/termux-app.git

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Rebrand app
        run: bash rebrand.sh "$APP_NAME" "$APP_PACKAGE" termux-app

      - name: Download official bootstraps
        working-directory: termux-app
        run: ./gradlew :app:downloadBootstraps --no-daemon

      - name: Patch bootstraps to the new package name
        run: python3 patch_bootstrap.py termux-app/app/src/main/cpp com.termux "$APP_PACKAGE"

      - name: Point the build at the patched bootstraps
        working-directory: termux-app
        run: |
          for arch in aarch64 arm i686 x86_64; do
            sha="$(sha256sum "app/src/main/cpp/bootstrap-$arch.zip" | cut -d' ' -f1)"
            sed -i -E "s/(downloadBootstrap\(\"$arch\",[[:space:]]*\")[0-9a-f]{64}/\1$sha/g" app/build.gradle
            echo "$arch $sha"
          done

      - name: Build APKs
        working-directory: termux-app
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          apks=(termux-app/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "No APKs were built"; exit 1; }
          for apk in "${apks[@]}"; do
            name="$(basename "$apk" .apk)"
            name="${name/termux-app/androidpocketterm}"
            name="${name/-unsigned/}"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS \
              --out "out/$name.apk" "$apk"
            "$BT/apksigner" verify "out/$name.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Package modified source (GPLv3)
        run: |
          tar --exclude='build' --exclude='.gradle' --exclude='.git' \
            -czf out/androidpocketterm-source.tar.gz termux-app rebrand.sh patch_bootstrap.py .github LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/* \
            --title "$APP_NAME build ${{ github.run_number }}" \
            --notes "Termux (termux/termux-app master + official bootstraps) rebranded as $APP_PACKAGE. GPLv3; modified source attached."
