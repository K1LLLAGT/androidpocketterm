name: Build AndroidPocketTerm

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: AndroidPocketTerm
  APP_PACKAGE: com.k1llagt.androidpocketterm

jobs:
  bootstrap:
    name: Bootstrap (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, arm, i686, x86_64]
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Clone termux-packages
        run: git clone --depth 1 https://github.com/termux/termux-packages.git

      - name: Set package name
        working-directory: termux-packages
        run: |
          sed -i -E "s/^(TERMUX_APP__PACKAGE_NAME|TERMUX_APP_PACKAGE)=\"com\.termux\"/\1=\"${APP_PACKAGE}\"/" scripts/properties.sh
          grep -n "${APP_PACKAGE}" scripts/properties.sh

      - name: Build bootstrap (compiles everything for the new prefix)
        working-directory: termux-packages
        run: ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ matrix.arch }}
          path: termux-packages/bootstrap-${{ matrix.arch }}.zip
          if-no-files-found: error

  apk:
    name: Build and sign APK
    needs: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Clone termux-app
        run: git clone --depth 1 https://github.com/termux/termux-app.git

      - uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-*
          merge-multiple: true
          path: termux-app/app/src/main/cpp

      - name: Rebrand
        run: bash rebrand.sh "$APP_NAME" "$APP_PACKAGE" termux-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APKs
        working-directory: termux-app
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign APKs
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p out
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          shopt -s nullglob
          apks=(termux-app/app/build/outputs/apk/release/*.apk)
          [ ${#apks[@]} -gt 0 ] || { echo "No APKs were built"; exit 1; }
          for apk in "${apks[@]}"; do
            name="$(basename "$apk" .apk)"
            name="${name/termux-app/androidpocketterm}"
            name="${name/-unsigned/}"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
              --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KS_PASS \
              --out "out/$name.apk" "$apk"
            "$BT/apksigner" verify "out/$name.apk"
          done
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Package modified source (GPLv3)
        run: |
          tar --exclude='build' --exclude='.gradle' --exclude='.git' \
            -czf out/androidpocketterm-source.tar.gz termux-app rebrand.sh .github

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" out/* \
            --title "$APP_NAME build ${{ github.run_number }}" \
            --notes "Rebranded build of termux/termux-app + termux/termux-packages (master) as $APP_PACKAGE. Licensed GPLv3; full modified source attached."
